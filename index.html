<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1f36 0%, #2d1b4e 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    user-select: none;
  }

  h1 {
    margin-bottom: 12px;
    font-size: 32px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .info-bar {
    display: flex;
    gap: 24px;
    margin-bottom: 12px;
    font-size: 18px;
  }
  .info-bar span b { color: #4ade80; }

  #game {
    background: #0f1420;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(74, 222, 128, 0.25), 0 8px 24px rgba(0,0,0,0.5);
    border: 2px solid #2a3348;
  }

  .hint {
    margin-top: 14px;
    font-size: 14px;
    color: #8b93a7;
  }

  .overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(10, 14, 24, 0.85);
    border-radius: 12px;
    padding: 40px;
    backdrop-filter: blur(4px);
  }
  .overlay h2 { font-size: 28px; }
  .overlay p { color: #aab; }

  button {
    padding: 10px 32px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    color: #0f1420;
    font-weight: bold;
    transition: transform 0.15s;
  }
  button:hover { transform: scale(1.06); }

  #wrap { position: relative; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<h1>贪吃蛇</h1>

<div class="info-bar">
  <span>得分：<b id="score">0</b></span>
  <span>最高分：<b id="best">0</b></span>
</div>

<div id="wrap">
  <canvas id="game" width="480" height="480"></canvas>

  <div class="overlay" id="startOverlay">
    <h2>🐍 贪吃蛇</h2>
    <p>方向键 / WASD 控制移动</p>
    <button id="startBtn">开始游戏</button>
  </div>

  <div class="overlay hidden" id="overOverlay">
    <h2 id="overTitle">游戏结束</h2>
    <p id="overScore"></p>
    <button id="restartBtn">再来一局</button>
  </div>
</div>

<p class="hint">空格键暂停 · 吃到食物加速，看你能撑多久！</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const GRID = 24;               // 每格像素
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake, dir, nextDir, food, score, best, speed, timer, running, paused;
best = Number(localStorage.getItem('snakeBest') || 0);
document.getElementById('best').textContent = best;

const startOverlay = document.getElementById('startOverlay');
const overOverlay  = document.getElementById('overOverlay');

function init() {
  snake = [{x: 8, y: 12}, {x: 7, y: 12}, {x: 6, y: 12}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  speed = 150;
  paused = false;
  document.getElementById('score').textContent = 0;
  placeFood();
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function tick() {
  if (paused) return;
  dir = nextDir;

  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // 撞墙或撞自己
  const hitWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    // 加速
    if (speed > 60) {
      speed -= 3;
      clearInterval(timer);
      timer = setInterval(tick, speed);
    }
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  // 背景
  ctx.fillStyle = '#0f1420';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 网格
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*GRID, 0); ctx.lineTo(i*GRID, canvas.height); ctx.stroke();
  }
  for (let j = 0; j <= ROWS; j++) {
    ctx.beginPath(); ctx.moveTo(0, j*GRID); ctx.lineTo(canvas.width, j*GRID); ctx.stroke();
  }

  // 食物（发光圆点）
  ctx.shadowColor = '#f87171';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#f87171';
  ctx.beginPath();
  ctx.arc(food.x*GRID + GRID/2, food.y*GRID + GRID/2, GRID/2 - 4, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 蛇身（渐变：头亮尾暗）
  snake.forEach((s, i) => {
    const t = i / snake.length;
    const r = Math.round(74 - t*40);
    const g = Math.round(222 - t*90);
    const b = Math.round(128 + t*60);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    const pad = i === 0 ? 1 : 2;
    ctx.beginPath();
    ctx.roundRect(s.x*GRID + pad, s.y*GRID + pad, GRID - pad*2, GRID - pad*2, 5);
    ctx.fill();
  });

  // 蛇头眼睛
  const h = snake[0];
  ctx.fillStyle = '#0f1420';
  const cx = h.x*GRID + GRID/2, cy = h.y*GRID + GRID/2;
  const ex = dir.x * 4, ey = dir.y * 4;
  const px = dir.y !== 0 ? 4 : 0, py = dir.x !== 0 ? 4 : 0;
  ctx.beginPath(); ctx.arc(cx + ex + px, cy + ey + py, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + ex - px, cy + ey - py, 2, 0, Math.PI*2); ctx.fill();
}

function gameOver() {
  clearInterval(timer);
  running = false;
  if (score > best) {
    best = score;
    localStorage.setItem('snakeBest', best);
    document.getElementById('best').textContent = best;
    document.getElementById('overTitle').textContent = '🏆 新纪录！';
  } else {
    document.getElementById('overTitle').textContent = '游戏结束';
  }
  document.getElementById('overScore').textContent = `本局得分：${score}`;
  overOverlay.classList.remove('hidden');
}

function startGame() {
  init();
  draw();
  startOverlay.classList.add('hidden');
  overOverlay.classList.add('hidden');
  running = true;
  clearInterval(timer);
  timer = setInterval(tick, speed);
}

function changeDir(x, y) {
  // 防止 180 度掉头
  if (dir.x === -x && dir.y === -y) return;
  nextDir = {x, y};
}

document.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  if (!running) return;
  if (k === ' ') { paused = !paused; return; }
  if (k === 'ArrowUp'    || k === 'w' || k === 'W') changeDir(0, -1);
  if (k === 'ArrowDown'  || k === 's' || k === 'S') changeDir(0, 1);
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') changeDir(-1, 0);
  if (k === 'ArrowRight' || k === 'd' || k === 'D') changeDir(1, 0);
});

// 触屏滑动支持
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: true});
canvas.addEventListener('touchend', e => {
  if (!touchStart || !running) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  if (Math.abs(dx) > Math.abs(dy)) changeDir(dx > 0 ? 1 : -1, 0);
  else changeDir(0, dy > 0 ? 1 : -1);
}, {passive: true});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// 初始画面
init();
draw();
</script>
</body>
</html>
